plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

android {
    namespace 'app.shura.manga'
    compileSdk 35
    defaultConfig { applicationId 'app.shura.manga'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; buildConfigField 'boolean', 'TRANSLATION_ENABLED', 'false' }
    buildFeatures { compose true; buildConfig true }
}

dependencies {
    implementation project(':shura-source-api')
    implementation project(':shura-source-host')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
