plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

android {
    namespace 'app.shura.manga'
    compileSdk 34
    buildToolsVersion '35.0.0'
    defaultConfig { applicationId 'app.shura.manga'; minSdk 26; targetSdk 34; versionCode 1; versionName '0.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'; buildConfigField 'boolean', 'TRANSLATION_ENABLED', 'false' }
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':shura-source-api')
    implementation project(':shura-source-host')
    implementation project(':shura-extension-runtime')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    // The BOM constrains androidTest too; without it here ui-test-junit4 resolves
    // to an empty version and :app:processDebugAndroidTestManifest fails, which
    // takes the whole android CI job down.
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
