plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'org.jetbrains.kotlin.plugin.compose' }

def releaseSigning = [
        storeFile: System.getenv('SHURA_RELEASE_KEYSTORE'),
        keyAlias: System.getenv('SHURA_RELEASE_KEY_ALIAS'),
        storePassword: System.getenv('SHURA_RELEASE_STORE_PASSWORD'),
        keyPassword: System.getenv('SHURA_RELEASE_KEY_PASSWORD'),
]
def hasReleaseSigning = releaseSigning.values().every { it?.trim() }

android {
    namespace 'app.shura.manga'
    compileSdk 34
    buildToolsVersion '35.0.0'

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(releaseSigning.storeFile)
                keyAlias releaseSigning.keyAlias
                storePassword releaseSigning.storePassword
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    defaultConfig {
    applicationId 'app.shura.manga'; minSdk 26; targetSdk 34
    // Bumped so this build installs over the previous one on the same device.
    // The application id and the signing key are both unchanged, so this is an
    // update and not a second app.
    versionCode 2; versionName '0.2.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    buildConfigField 'boolean', 'TRANSLATION_ENABLED', 'false'
    // The certificate Shura signs its own extensions with, as a SHA-256.
    //
    // Supplied by the build that holds the key and never committed: inject it
    // with -Pshura.publisherCert=<64 hex>, or SHURA_PUBLISHER_CERT in the
    // environment. Empty is the correct default - it means "no publisher
    // configured", and extensions Shura built are then refused by name with a
    // message saying why, rather than being run under somebody else's
    // certificate.
    //
    // There is deliberately no fallback to the debug keystore. That key has the
    // password "android", is regenerated per machine, and on a debug build it
    // is the *same identity* as the app's own signer - so trusting it as a
    // publisher would mean "whoever compiled this app build may also sign
    // extensions", which is the opposite of the check.
    def publisherCert = project.findProperty('shura.publisherCert') ?:
            System.getenv('SHURA_PUBLISHER_CERT') ?: ''
    buildConfigField 'String', 'SHURA_PUBLISHER_CERT', "\"${publisherCert}\""
}
    buildFeatures { compose true; buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

gradle.taskGraph.whenReady { graph ->
    def releaseBuildRequested = graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('release')
    }
    if (releaseBuildRequested && !hasReleaseSigning) {
        throw new GradleException(
                'Release builds require SHURA_RELEASE_KEYSTORE, SHURA_RELEASE_KEY_ALIAS, ' +
                        'SHURA_RELEASE_STORE_PASSWORD, and SHURA_RELEASE_KEY_PASSWORD.'
        )
    }
}

dependencies {
    implementation project(':shura-source-api')
    implementation project(':shura-source-host')
    implementation project(':shura-extension-runtime')
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    // Icons for the library's search field and the empty states. Core only, so
    // the dependency stays small.
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is stubs that throw on the JVM. The real
    // implementation is what production uses, so the tests use it too rather
    // than a different serializer that would pass while the app did not.
    testImplementation 'org.json:json:20240303'
    // The BOM constrains androidTest too; without it here ui-test-junit4 resolves
    // to an empty version and :app:processDebugAndroidTestManifest fails, which
    // takes the whole android CI job down.
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
