plugins { id 'com.android.library'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'app.shura.runtime'
    compileSdk 34
    buildToolsVersion '35.0.0'
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.all { it.systemProperty 'shura.repo.dir', rootProject.file('../repo').absolutePath } }
}
// The instrumentation tests need the artifacts Shura Core publishes. A device
// cannot see the build machine's filesystem, and the previous fallback path
// (/workspace/repo) only exists in the development sandbox, so on CI the tests
// found no repository at all. The published repository is packaged into the test
// APK's assets instead, so the tests read exactly the committed bytes wherever
// they run.
def publishedRepo = rootProject.file('../repo')
android {
    sourceSets {
        androidTest {
            assets.srcDirs += layout.buildDirectory.dir('androidTest-published-repo')
        }
    }
}
tasks.register('stagePublishedRepoForTests', Copy) {
    from publishedRepo
    into layout.buildDirectory.dir('androidTest-published-repo')
    include '**'
}
tasks.matching { it.name ==~ /androidTest.*Assets/ || it.name ==~ /merge.*AndroidTestAssets/ }.configureEach {
    dependsOn 'stagePublishedRepoForTests'
}
afterEvaluate {
    tasks.matching { it.name ==~ /connected.*AndroidTest/ }.configureEach {
        dependsOn 'stagePublishedRepoForTests'
        systemProperty 'shura.repo.dir', publishedRepo.absolutePath
    }
}

dependencies {
    // The shipped extension APKs bind against okhttp3 types they do not bundle,
    // so the host supplies the library. Apache-2.0; this is the transitive
    // compatibility layer only and carries no part of any other project.
    api 'com.squareup.okhttp3:okhttp:4.12.0'
    api project(':shura-source-api')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is not available on the JVM test classpath; the real
    // implementation makes the repository contract testable off-device.
    testImplementation 'org.json:json:20240303'
    // The isolation test needs the real MangaDexSource and SourceHost.
    testImplementation project(':shura-source-host')
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
