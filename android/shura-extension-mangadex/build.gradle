plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'app.shura.extension.mangadex'
    compileSdk 34
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'app.shura.extension.mangadex'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    // A debug-signed build is the artifact under test. Release signing is the
    // operator's key and is never held in this repository.
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

// Shura's own contract, and nothing else. No Tachiyomi or Mihon artifact is
// declared or consumed here: the extension implements app.shura.source.
dependencies {
    implementation project(':shura-source-api')
    // Same coroutines version the runtime already uses; the contract's methods
    // are suspend functions, so a dispatcher is needed to run them off-thread.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
}
