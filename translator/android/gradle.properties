org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP downloads its own aapt2 from Maven, which is the x86-64 Linux build. This host
# is aarch64, so that binary cannot run. Point AGP at the aapt2 shipped in the local
# SDK, which is the native aarch64 one and demonstrably works here.
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/35.0.0/aapt2
