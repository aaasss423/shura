name: CI
on: [push, pull_request]
permissions:
  contents: write

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m compileall -q shura_core tests
      - name: Run the Python test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee python-tests.log
          status=${PIPESTATUS[0]}
          {
            echo "### Python test suite"
            echo
            echo '```'
            grep -E '^(FAIL|ERROR|OK|Ran )|^(FAILED|OK)' python-tests.log | tail -40 || true
            echo '```'
            echo
            echo '### Tracebacks'
            echo
            echo '```'
            grep -A 30 -E '^(FAIL|ERROR):' python-tests.log | head -200 || echo 'no FAIL/ERROR block matched'
            echo '```'
            echo
            # The full log goes in as well: the job-log endpoint needs admin, so
            # for anyone without it this summary is the only place the traceback
            # can be read from.
            echo "<details><summary>Full unittest output ($(wc -l < python-tests.log) lines)</summary>"
            echo
            echo '```'
            cat python-tests.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Publish the python test log
        if: always()
        run: |
          # GitHub gates job logs and artifact downloads behind admin access, which
          # leaves a failing run unreadable to anyone else. Pushing the log to a
          # diagnostics branch makes the evidence inspectable with a plain git
          # fetch. It never touches main.
          mkdir -p diagnostics
          cp python-tests.log diagnostics/ 2>/dev/null || true
          cd diagnostics
          git init -q .
          git config user.email 'ci@shura.invalid'
          git config user.name 'Shura CI'
          git add -A
          git commit -q -m "python test log for run ${GITHUB_RUN_ID}" || exit 0
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-diagnostics/python"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git diff --check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :shura-source-api:testDebugUnitTest :shura-source-host:testDebugUnitTest :app:compileDebugAndroidTestKotlin
        working-directory: android

  # Real device run: the extension runtime can only be proved by loading the
  # published ProComic APK and searching through it. That needs an Android
  # runtime, so it runs on an emulator here rather than being left unverified.
  android-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" \
                    "system-images;android-34;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the real extension load on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Everything here runs while the emulator is still alive: this action
          # kills the device when the script exits, so adb logcat and the JUnit
          # XML have to be captured in here, not in a later step.
          script: |
            set -o pipefail
            gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8" \
              :shura-extension-runtime:connectedDebugAndroidTest \
              2>&1 | tee android-emulator-gradle.log
            status=${PIPESTATUS[0]}
            mkdir -p diagnostics
            cp android-emulator-gradle.log diagnostics/ || true
            find android/shura-extension-runtime/build -name '*.xml' -path '*connected*' \
              -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
            find android/shura-extension-runtime/build/reports -type f \
              -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
            adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || \
              echo 'adb logcat failed: no device' > diagnostics/logcat.txt
            {
              echo "### Emulator: RealExtensionLoadTest"
              echo
              echo "gradle exit status: $status"
              echo
              echo '#### Gradle tail'
              echo '```'
              tail -60 android-emulator-gradle.log
              echo '```'
              echo
              if find diagnostics -name 'TEST-*.xml' | grep -q .; then
                echo '#### Per-test results'
                echo '```'
                for f in $(find diagnostics -name 'TEST-*.xml'); do
                  echo "-- $f"
                  python3 - "$f" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception as exc:
              print(f"unreadable: {exc}")
              raise SystemExit(0)
          for case in root.iter("testcase"):
              name = case.get("name", "?")
              bad = [c for c in case if c.tag in ("failure", "error")]
              if bad:
                  print(f"FAIL {name}")
                  for c in bad:
                      print(f"  {c.tag}: {c.get('message','')}")
                      print("  " + "\n  ".join((c.text or "").strip().splitlines()[:25]))
                      print(f"  at {c.get('classname','')}")
              elif any(c.tag == "skipped" for c in case):
                  print(f"SKIP {name}")
              else:
                  print(f"PASS {name}")
          PYEOF
                done
                echo '```'
              else
                echo '#### No JUnit XML'
                echo 'The instrumentation produced no XML, so no test ever reported.'
                echo 'See the Gradle tail and logcat above.'
              fi
              echo
              echo '#### logcat (class-loading and failures)'
              echo '```'
              grep -iE 'shura|dexclassloader|ClassNotFound|NoSuchMethod|NoClassDef|AndroidRuntime|TestRunner|INSTRUMENTATION' diagnostics/logcat.txt | tail -80 || echo 'nothing matched'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
      - name: Upload the diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            diagnostics/
            android-emulator-gradle.log
            android/**/build/reports/**
      - name: Publish the emulator diagnostics
        if: always()
        run: |
          mkdir -p diagnostics/published
          cp -r diagnostics/. diagnostics/published/ 2>/dev/null || true
          cp android-emulator-gradle.log diagnostics/published/ 2>/dev/null || true
          cd diagnostics
          git init -q .
          git config user.email 'ci@shura.invalid'
          git config user.name 'Shura CI'
          git add -A
          git commit -q -m "emulator diagnostics for run ${GITHUB_RUN_ID}" || exit 0
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/ci-diagnostics/emulator"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
