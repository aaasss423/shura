name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python -m compileall -q shura_core tests
      - name: Run the Python test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee python-tests.log
          status=${PIPESTATUS[0]}
          {
            echo "### Python test suite"
            echo
            echo '```'
            grep -E '^(FAIL|ERROR|OK|Ran )|^(FAILED|OK)' python-tests.log | tail -40 || true
            echo '```'
            echo
            echo '### Tracebacks'
            echo
            echo '```'
            grep -A 30 -E '^(FAIL|ERROR):' python-tests.log | head -200 || echo 'no FAIL/ERROR block matched'
            echo '```'
            echo
            # The full log goes in as well: the job-log endpoint needs admin, so
            # for anyone without it this summary is the only place the traceback
            # can be read from.
            echo "<details><summary>Full unittest output ($(wc -l < python-tests.log) lines)</summary>"
            echo
            echo '```'
            cat python-tests.log
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - run: git diff --check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :shura-source-api:testDebugUnitTest :shura-source-host:testDebugUnitTest :app:compileDebugAndroidTestKotlin
        working-directory: android

  # Real device run: the extension runtime can only be proved by loading the
  # published ProComic APK and searching through it. That needs an Android
  # runtime, so it runs on an emulator here rather than being left unverified.
  android-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" \
                    "system-images;android-34;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the real extension load on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Everything here runs while the emulator is still alive: this action
          # kills the device when the script exits, so adb logcat and the JUnit
          # XML have to be captured in here, not in a later step.
          script: |
            set -o pipefail
            gradle --no-daemon -Dorg.gradle.jvmargs="-Xmx1536m -Dfile.encoding=UTF-8" \
              :shura-extension-runtime:connectedDebugAndroidTest \
              2>&1 | tee android-emulator-gradle.log
            status=${PIPESTATUS[0]}
            mkdir -p diagnostics
            cp android-emulator-gradle.log diagnostics/ || true
            find android/shura-extension-runtime/build -name '*.xml' -path '*connected*' \
              -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
            find android/shura-extension-runtime/build/reports -type f \
              -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
            adb logcat -d -v threadtime > diagnostics/logcat.txt 2>&1 || \
              echo 'adb logcat failed: no device' > diagnostics/logcat.txt
            {
              echo "### Emulator: RealExtensionLoadTest"
              echo
              echo "gradle exit status: $status"
              echo
              echo '#### Gradle tail'
              echo '```'
              tail -60 android-emulator-gradle.log
              echo '```'
              echo
              if find diagnostics -name 'TEST-*.xml' | grep -q .; then
                echo '#### Per-test results'
                echo '```'
                python3 scripts/junit_summary.py $(find diagnostics -name 'TEST-*.xml') || true
                echo '```'
                # Annotations render inline on the run page, so the failure is
                # visible without opening logs or downloading artifacts.
                for f in $(find diagnostics -name 'TEST-*.xml'); do
                  python3 scripts/junit_summary.py "$f" | grep -E '^   (FAIL|ERROR)' \
                    | sed 's/^   //' | while read -r line; do
                        echo "::error title=Instrumentation test failed::${line}"
                      done
                done
              else
                echo '#### No JUnit XML'
                echo 'The instrumentation produced no XML, so no test ever reported.'
                echo 'See the Gradle tail and logcat above.'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit $status
      - name: Upload the diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            diagnostics/
            android-emulator-gradle.log
            android/**/build/reports/**
