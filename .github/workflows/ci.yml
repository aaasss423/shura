name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q shura_core tests
      - name: Run the Python test suite
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee python-tests.log
          status=${PIPESTATUS[0]}
          {
            echo "### Python test suite"
            echo
            echo '```'
            grep -E '^(FAIL|ERROR|OK|Ran )|^(FAILED|OK)' python-tests.log | tail -40 || true
            echo '```'
            echo
            echo '### Tracebacks'
            echo
            echo '```'
            grep -A 25 -E '^(FAIL|ERROR):' python-tests.log | head -120 || echo 'no failure blocks matched'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Upload the python test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-tests-log
          path: python-tests.log
      - run: git diff --check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :shura-source-api:testDebugUnitTest :shura-source-host:testDebugUnitTest :app:compileDebugAndroidTestKotlin
        working-directory: android

  # Real device run: the extension runtime can only be proved by loading the
  # published ProComic APK and searching through it. That needs an Android
  # runtime, so it runs on an emulator here rather than being left unverified.
  android-emulator:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the Android command-line tools
        run: |
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          mkdir -p "$SDK/cmdline-tools"
          curl -sSLo /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv -f "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - name: Set up the Android SDK
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;35.0.0" \
                    "system-images;android-34;google_apis;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the real extension load on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :shura-extension-runtime:connectedDebugAndroidTest
      - name: Collect the diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          # JUnit XML is what the android test plugin writes; it names every test
          # and the exception each failing one raised.
          find android -path '*connected*' -name '*.xml' -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
          find android -path '*reports*' -name '*.html' -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
          adb logcat -d > diagnostics/logcat.txt 2>/dev/null || echo 'logcat unavailable' > diagnostics/logcat.txt
          {
            echo "### RealExtensionLoadTest"
            echo
            if compgen -G 'diagnostics/**/TEST-*.xml' > /dev/null; then
              for f in $(find diagnostics -name 'TEST-*.xml'); do
                echo "#### $f"
                echo '```'
                grep -oE 'tests="[0-9]+" *(skipped|failures)="[0-9]+"|testcase name="[^"]*"|<failure[^>]*>|message="[^"]{0,300}"' "$f" | head -60
                echo '```'
                echo
              done
            else
              echo 'No JUnit XML was produced. The test run failed before reporting, or the'
              echo 'instrumentation never reached the device. See logcat.txt and the Gradle log.'
            fi
            echo '### logcat (filtered)'
            echo '```'
            grep -iE 'shura|dexclassloader|ClassNotFound|NoSuchMethod|NoClassDef|AndroidRuntime|TestRunner' diagnostics/logcat.txt 2>/dev/null | tail -60 || echo 'nothing matched'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            diagnostics/
            android/**/build/reports/**
