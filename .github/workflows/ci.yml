name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q shura_core tests
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :shura-source-api:testDebugUnitTest :shura-source-host:testDebugUnitTest :app:compileDebugAndroidTestKotlin
        working-directory: android
