[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shura"
version = "0.1.0"
description = "Independent manga source discovery, validation, and publishing system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
shura = "shura_core.cli:main"
shura-daemon = "shura_core.daemon:main"

[tool.setuptools.packages.find]
include = ["shura_core*"]

[tool.setuptools.package-data]
shura_core = ["publishing/index.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
