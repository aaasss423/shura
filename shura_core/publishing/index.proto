// Shura's own repository index schema (not Mihon/Keiyoushi's format).
// Generated by shura_core.publishing.index_pb.encode_index.
syntax = "proto3";

package shura.index.v1;

message ShuraIndex {
  string repo = 1;
  int64 generated_at = 2;
  repeated ShuraExtension extensions = 3;
}

message ShuraExtension {
  string name = 1;
  string pkg = 2;
  string apk = 3;
  string lang = 4;
  string version = 5;
  int32 code = 6;
  bool nsfw = 7;
  repeated string sources = 8;
  string source_id = 9;
  string identity = 10;
  string artifact_sha256 = 11;
  string signing_certificate_sha256 = 12;
  int32 schema_version = 13;
}
