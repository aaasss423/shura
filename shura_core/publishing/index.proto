// Mihon/Keiyoushi repository index schema emitted by
// shura_core.publishing.index_pb.encode_index (v2 protobuf index, "index.pb").
//
// Field numbers match Mihon's NetworkExtensionStore @ProtoNumber annotations
// (mihonapp/mihon data/src/main/java/mihon/data/extension/model/
// NetworkExtensionStore.kt) and Keiyoushi's .github/scripts/index.proto.
syntax = "proto3";

package mihon.extension.store.v2;

message Index {
  string name = 1;
  string badgeLabel = 2;
  string signingKey = 3;              // SHA-256 certificate fingerprint (64 hex)
  Contact contact = 4;
  ExtensionList extensionList = 101;  // inline extension list (NOT 5)
  string extensionListUrl = 102;      // alternative external list URL (unused)
}

message Contact {
  string website = 1;
  string discord = 2;
}

message ExtensionList {
  repeated Extension extensions = 1;
}

enum ContentWarning {
  CONTENT_WARNING_UNSPECIFIED = 0;
  CONTENT_WARNING_SAFE = 1;
  CONTENT_WARNING_MIXED = 2;
  CONTENT_WARNING_NSFW = 3;
}

message Extension {
  string name = 1;
  string packageName = 2;
  Resources resources = 3;
  string extensionLib = 4;
  int64 versionCode = 5;
  string versionName = 6;
  ContentWarning contentWarning = 7;
  repeated Source sources = 8;
}

message Resources {
  string apkUrl = 1;
  string iconUrl = 2;
}

message Source {
  int64 id = 1;
  string name = 2;
  string language = 3;
  string homeUrl = 4;
  repeated string mirrorUrls = 5;
  string message = 7;
}